description: >-
  FinOps view of WellSaid Labs spend. WellSaid bills primarily through
  subscription tiers (seats plus download/render allowances) for Studio, with
  programmatic API access offered as a paid / Enterprise capability. The natural
  usage meter for the text-to-speech API is characters rendered (a render
  request accepts up to 1,000 characters), but no public per-character API rate
  card is published; API cost is negotiated as part of an Enterprise agreement.
notes: >-
  Per-character API pricing and any render/download allowances are not publicly
  documented; verify metering and unit rates with WellSaid Labs during
  reconciliation. Track characters rendered and clips/streams produced as the
  primary cost drivers.
sources:
- https://wellsaidlabs.com/pricing/
