publisherName: WellSaid Labs
serviceCategory: AI and Machine Learning
billingModel:
  pricingCategory: Subscription
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: WellSaid Labs API
  ServiceCategory: AI and Machine Learning
  ProviderName: WellSaid Labs
  PublisherName: WellSaid Labs
  InvoiceIssuerName: WellSaid Labs
  BillingCurrency: USD
  ChargeCategory: Usage
