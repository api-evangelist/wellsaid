meters:
- name: tts_characters
  description: Characters of text rendered to speech via the API, the natural per-character cost driver (up to 1,000 characters per request).
  unit: characters
  aggregation: sum
  dimensions:
  - account
  - speaker_id
  - model
- name: clips_rendered
  description: Number of TTS clips created via POST /tts/clips.
  unit: clips
  aggregation: sum
  dimensions:
  - account
  - speaker_id
- name: stream_renders
  description: Number of streaming TTS renders via POST /tts/stream.
  unit: renders
  aggregation: sum
  dimensions:
  - account
  - speaker_id
- name: word_timing_renders
  description: Number of word-timing renders via POST /tts/word-timing (audio plus JSON/SRT/VTT).
  unit: renders
  aggregation: sum
  dimensions:
  - account
  - speaker_id
- name: seats
  description: Subscription seats for Studio access, billed per seat per month.
  unit: seats
  aggregation: sum
  dimensions:
  - account
  - plan
principles:
- name: Visibility
  description: Track characters rendered and clips/streams produced per API key; reconcile against subscription seat and download allowances.
- name: Allocation
  description: Tag API keys per workload/team and map to internal cost centers; isolate Enterprise API spend from Studio seats.
- name: Optimization
  description: Keep render text concise within the 1,000-character cap, reuse clips and combine rather than re-rendering, and apply replacement libraries to avoid retry renders.
- name: Accountability
  description: Assign owners per project/key and review character/render volume monthly against the Enterprise agreement.
