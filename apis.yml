  - url: https://docs.wellsaidlabs.com/reference
    type: APIReference
  - url: openapi/wellsaid-openapi.yml
    type: OpenAPI
  - url: collections/wellsaid.postman_collection.json
    type: PostmanCollection
  - url: collections/wellsaid.opencollection.json
    type: OpenCollection
  description: List available voice avatars (GET /tts/avatars) with their speaker_id,
    name, accent, and speaking style for selecting a voice, plus respelling suggestions
    and replacement libraries that shape pronunciation across renders.
